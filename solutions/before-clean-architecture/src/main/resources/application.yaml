spring:
  application:
    name: smarttasks
  threads:
    virtual:
      enabled: true   # une requête = un thread virtuel (Java 21+, voir chap. 03 §4.4)
  datasource:
    url: jdbc:postgresql://localhost:5432/smarttasks
    username: smart
    password: smart
  jpa:
    hibernate:
      ddl-auto: update   # garde les données entre deux redémarrages (dev) ; voir chap. 01 §8
    show-sql: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://accounts.google.com
          # Rejette les tokens émis pour une autre application (claim "aud")
          audiences: ${GOOGLE_CLIENT_ID}
storage:
  s3:
    endpoint: http://localhost:9000   # RustFS (docker-compose)
    region: us-east-1                 # requis par le SDK, ignoré par RustFS
    access-key: rustfsadmin
    secret-key: rustfsadmin
    bucket: smarttasks                # créé au démarrage s'il n'existe pas